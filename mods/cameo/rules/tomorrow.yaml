##############################################
#                  Inherited Units
##############################################

TRUCK:
	Inherits: ^Vehicle
	Inherits@selection: ^SelectableSupportUnit
	Buildable:
		Queue: Vehicle.GDI, Vehicle.Nod
		BuildPaletteOrder: 35
		Prerequisites: vehicleproduction
		BuildDuration: 500
		Description: actor-truck.description
	Valued:
		Cost: 1000
	Tooltip:
		Name: actor-truck.name
	Health:
		HP: 11000
	Armor:
		Type: Light
	Mobile:
		Speed: 113
	RevealsShroud:
		Range: 4c0
	Encyclopedia:
		Description: actor-truck.encyclopedia
		Order: 220
		Category: Vehicles
		Scale: 3
		PreviewOwner: GDI
	DeliversCash:
		Payload: 1000
		PlayerExperience: 10
	SpawnActorOnDeath:
		Actor: TRUCK.Husk
		OwnerType: InternalName
		EffectiveOwnerFromOwner: true

##############################################
