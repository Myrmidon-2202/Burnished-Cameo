	Valued:
		Cost: 600
	Tooltip:
		Name: Tank Hunter
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 40
		Prerequisites: weap.dtjapan
		Queue: Vehicle.Dtjapan
		BuildDurationModifier: 40
		Description: Fast, light tank.   Strong vs Vehicles, Tanks   Weak vs Infantry
	Armament:
		Weapon: 105mm
		Recoil: 85
		RecoilRecovery: 17
		LocalOffset: 720,0,90
		MuzzleSequence: muzzle
	FirepowerMultiplier@TankHunter:
		Modifier: 125
	RenderSprites:
		-PlayerPalette: raplayer
	Voiced:
		VoiceSet: dtjapvehVoice

msam.dtjapan:
	Inherits: MLRS
	Tooltip:
		Name: MLRS
	Inherits@AUTOTARGET: ^AutoTargetAllAssaultMove
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites: weap.dtjapan, DTHQ
		Queue: Vehicle.Dtjapan
		Description: Long range rocket artillery.   Strong vs all Ground units.
	Armament@PRIMARY:
		Weapon: 227mmT
		LocalOffset: 213,128,0, 213,-128,0
	Armament@SECONDARY:
		Name: secondary
		Weapon: 227mmT
		LocalOffset: 213,-128,0, 213,128,0
	Armament@ROCKET:
		Weapon: BikeRockets
		LocalOffset: 213,-128,0, 213,128,0
	RenderSprites:
		Image: MSAM
	Voiced:
		VoiceSet: dtjapvehVoice

