##############################################
LCV:
	Inherits: ^Vehicle
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@selection: ^SelectableSupportUnit
	Inherits@mcv: ^MCV
	Valued:
		Cost: 800
	Tooltip:
		Name: Light Construction Vehicle (Brazil)
	Buildable:
		BuildPaletteOrder: 100
		Prerequisites: ~fact.dtbrazil
		Queue: Vehicle.Dtbrazil
		BuildDurationModifier: 40
		Description: Deploys into a Flame Tower
	Selectable:
		Priority: 4
		DecorationBounds: 1536, 1536
	Mobile:
		Speed: 75
		Locomotor: heavywheeled
	Health:
		HP: 150000
	Repairable:
		HpPerStep: 2182
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 7c0
	Transforms:
		IntoActor: dtftur
		Offset: -1,-1
		Facing: 432
		TransformSounds: constru2.aud, hvydoor1.aud
