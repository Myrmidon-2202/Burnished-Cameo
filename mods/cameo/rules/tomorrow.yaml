dtfbik:
	Inherits: ^Vehicle
	Inherits@EXPERIENCE: ^GainsExperienceVehicle
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@EMP: ^FrontalEMP
	Inherits@AntiInf: ^PrioritizeInfantry
	Inherits@AntiBuil: ^PrioritizeBuilding
	Valued:
		Cost: 300
	Tooltip:
		Name: Flame Bike
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites:  ~anyhq, ~disabled
		Queue: Vehicle, RAVehicle
		Description: Heavily armored flame-throwing vehicle.   Strong vs Infantry, Buildings and Vehicles   Weak vs Tanks
	Mobile:
		TurnSpeed: 64
		Speed: 170
	Health:
		HP: 12000
	Repairable:
		HpPerStep: 2046
	Armor:
		Type: Light
	RevealsShroud:
		Range: 7c0
	Armament:
		Weapon: BigFlamer
		LocalOffset: 512,1,42, 512,-1,42
		MuzzleSequence: muzzle
	AttackFrontal:
		FacingTolerance: 0
	WithMuzzleOverlay:
	FireWarheadsOnDeath:
		Weapon: FlametankExplode
		EmptyWeapon: FlametankExplode
	Inherits@EXT: ^ExternalConditions ##########
	AcceptsDeliveredExperience: ##########
		ValidTypes: vehicle ##########

dtdtrk:
	Inherits: ^Vehicle
	Inherits@EXT: ^ExternalConditions
	Inherits@EMP: ^FrontalEMP
	Buildable:
		Queue: Vehicle, RAVehicle
		BuildPaletteOrder: 160
		Prerequisites:  ~anyhq
		Description: Truck with actively armed nuclear explosives. Has very weak armor.
	Valued:
		Cost: 400
	Tooltip:
		Name: Explosive Truck
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Health:
		HP: 15000
	Armor:
		Type: Light
	Mobile:
		Speed: 110
	RevealsShroud:
		Range: 4c0
	FireWarheadsOnDeath@bomb:
		Weapon: FlametankExplode
		EmptyWeapon: FlametankExplode
		DamageSource: Killer
		RequiresCondition: !disabled
	FireWarheadsOnDeath@bomb2:
		Weapon: Napalm
		EmptyWeapon: Napalm
		DamageSource: Killer
		RequiresCondition: !disabled
	FireWarheadsOnDeath@bomb3:
		Weapon: FlametankExplode
		EmptyWeapon: FlametankExplode
		DamageSource: Killer
		RequiresCondition: !disabled
	AttackFrontal:
		FacingTolerance: 512
	Armament@PRIMARY:
		Weapon: DemoTruckTargeting
	AutoTarget:
	GrantConditionOnAttack:
		Condition: triggered
	GrantConditionOnDeploy:
		DeployedCondition: triggered
		PauseOnCondition: disabled
	Voiced:
		VoiceSet: RussianVehicleVoice
	-DamageMultiplier@IRONCURTAIN:
	KillsSelf:
		RequiresCondition: !disabled && (invulnerability || triggered)
	Chronoshiftable:
		ExplodeInstead: true
