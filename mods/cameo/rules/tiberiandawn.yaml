CNCSS:
	Inherits: ^BoatUnit
	Inherits@Template: ^ScoutShipTemplate
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@EMP: ^FrontalEMP
	Inherits@sub: ^Submarine
	Valued:
		Cost: 1600
	Tooltip:
		Name: Nod Attack Submarine
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 20
		Prerequisites: ~cncspen
		Queue: Naval.Nod, RANaval.Nod
		Description: actor-ss.description
	Mobile:
		Speed: 80
		TurnSpeed: 16
	Health:
		HP: 160000
	ChangesHealth@SelfHealing:
		Step: 64
	Armor:
		Type: Heavy
	Turreted:
		TurnSpeed: 16
		Offset: 512,0,0
	Armament@PRIMARY:
		Weapon: NodTorpTube
		LocalOffset: 256,128,0, 256,-128,0
		RequiresCondition: !up_blackmarketupgrades
	Armament@Upgrade:
		Weapon: NodTorpTubeBlackMarket
		LocalOffset: 256,128,0, 256,-128,0
		RequiresCondition: up_blackmarketupgrades
	RenderRangeCircle:
	Targetable:
		TargetTypes: Ground, Water, Ship, Submarine
	AttackFrontal:
		FacingTolerance: 0
	Selectable:
		DecorationBounds: 1536, 1536
	DeliversCash:
		Payload: 475
	Voiced:
		VoiceSet: VehicleVoice
	Cloak@underwater:
	RenderSprites:
		Image: cncss
		PlayerPalette: player_rgba

ssmsub:
	Inherits: ^BoatUnit
	Inherits@Template: ^ArtilleryShipTemplate
	Inherits@exp: ^GainsExperienceTD
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMove
	Inherits@EMP: ^FrontalEMP
	Inherits@sub: ^Submarine
		Valued:
		Cost: 2800
	Tooltip:
		Name: Ballistic Missile Submarine
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 50
		Prerequisites: ~hq.nod
		Queue: Naval, RANaval
		Description: actor-msub.description
	Mobile:
		Speed: 60
		TurnSpeed: 12
	Health:
		HP: 200000
	ChangesHealth@SelfHealing:
		Step: 80
	Armor:
		Type: Medium
	Armament:
		Weapon: HonestJohn
		LocalOffset: 800,200,0, 800,-200,0
		MuzzleSequence: muzzle
	WithMuzzleOverlay:
	Targetable:
		TargetTypes: Ground, Water, Ship, Submarine
	AttackFrontal:
		FacingTolerance: 0
	Selectable:
		DecorationBounds: 1536, 1536
	DeliversCash:
		Payload: 1000
	Cloak@underwater:
		CloakDelay: 100
	Voiced:
		VoiceSet: VehicleVoice
	FirepowerMultiplier@BallisticMissileSubBuff:
		Modifier: 200
	FireWarheadsOnDeath:
		Weapon: ArtilleryShell
	AmmoPool:
		Ammo: 2
		AmmoCondition: ammo
	ReloadAmmoPool:
		Delay: 125
		Count: 1
	WithFacingSpriteBody:
		Sequence: idle
		RequiresCondition: ammo == 2
	WithFacingSpriteBody@OneMissile:
		Sequence: idle-one
		RequiresCondition: ammo == 1
	WithFacingSpriteBody@NoMissiles:
		Sequence: idle-empty
		RequiresCondition: !ammo
	RenderSprites:
		Image: ssmsub

nodlasercorvette:
