CIV2_MCV:
	Inherits: ^Vehicle
	Inherits@flag: ^CIV2UnitFlag
	Inherits@Template: ^SupportVehicleTemplate
	Inherits@selection: ^SelectableSupportUnit
	Inherits@mcv: ^MCV
	Valued:
		Cost: 3500
	Tooltip:
		Name: Settler [MCV]
	Buildable:
		BuildPaletteOrder: 100
		Prerequisites: ~wweap, anyhq, ~techlevel.medium
		Queue: Vehicle, RAVehicle
		BuildDuration: 3750
		BuildDurationModifier: 40
		Description: Deploys into another Construction Yard.\n  Unarmed
	Selectable:
		DecorationBounds: 1536, 1536
	Mobile:
		Speed: 71
		Locomotor: heavywheeled
	Health:
		HP: 120000
	Repairable:
		HpPerStep: 2182
	Armor:
		Type: Heavy
	RevealsShroud:
		Range: 7c0
	Transforms:
		IntoActor: civ2_district_capital_bronze
		Offset: -1,-1
		Facing: 432
		TransformSounds: constru2.aud, hvydoor1.aud
		NoTransformNotification: BuildingCannotPlaceAudio
	MustBeDestroyed:
		RequiredForShortGame: true
	BaseBuilding:
	SelectionDecorations:
	Voiced:
		VoiceSet: voiceWorm
	ProvidesPrerequisite@factiongdi:
		Prerequisite: mmworms

civ2_warrior:
	Inherits: ^Soldier
	Inherits@flag: ^CIV2UnitFlag
	Inherits@CIV2Infantry: ^CIV2Infantry
	Inherits@EXPERIENCE: ^GainsExperience
	Inherits@AUTOTARGET: ^AutoTargetGroundAssaultMoveMelee
	Inherits@DECORATIONS: ^InfantryExperienceHospitalHazmatOverrides
	# Inherits@upgrade_swords: ^wc_h_str_sword
	# Inherits@upgrade_shields: ^wc_h_str_shield
	Valued:
		Cost: 300
	Tooltip:
		Name: Warrior
	UpdatesPlayerStatistics:
		AddToArmyValue: true
	Buildable:
		BuildPaletteOrder: 10
		Prerequisites: ~civ2_district_production_bronze
		Queue: Infantry, RAInfantry
		Description: Basic Melee Infantry. Slow but can take some damage.
		BuildDuration: 150
		BuildDurationModifier: 100
	Mobile:
		Speed: 56
	DamageMultiplier@DamageReduction:
		Modifier: 85
	FirepowerMultiplier@FirepowerIncrease:
		Modifier: 115
	Health:
		HP: 14400
	DamageMultiplier@armor:
		Modifier: 60
	Armor:
		Type: None
	#Food
	Power:
		Amount: -5
	AutoTarget:
		ScanRadius: 6
		InitialStance: AttackAnything
	Armament:
		Weapon: footmanSlice
	WithDeathAnimation:
		UseDeathTypeSuffix: false
	WithInfantryBody:
		DefaultAttackSequence: shoot
		-IdleSequences: idle1,idle2,idle3,idle4
	Voiced:
		VoiceSet: voicehuman
	Crushable:
		CrushClasses: vehicle

