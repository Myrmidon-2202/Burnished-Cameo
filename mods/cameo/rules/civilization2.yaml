#		BUILDING CIV2
####################################################################################################

CIV2_DISTRICT_CAPITAL_BRONZE:
	Inherits: ^Civ2Building
	Inherits@flag: ^CIV2BuildingFlag
	Inherits@shape: ^2x2Shape
	Inherits@CPQ: ^CPQCondition
	Inherits@aicash: ^AIConyardCash
	Inherits@conyard: ^Conyard
	GrantExternalConditionToOwner@BuildingsOwned:
		Condition: BuildingsOwned
	Selectable:
		Bounds: 2048, 2048
	HitShape:
		TargetableOffsets: 630,299,0
	Valued:
		Cost: 2000
	Tooltip:
		Name: Capital District [Bronze]
	ProvidesPrerequisite:
		Prerequisite: civ2_district_capital_bronze
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 110000
	RevealsShroud:
		Range: 4c0
	Transforms:
		IntoActor: civ2_mcv
		Offset: -1,-1
		Facing: 432
		TransformSounds: constru2.aud, hvydoor1.aud
		NoTransformNotification: BuildingCannotPlaceAudio
	RallyPoint:
	Exit@1:
		SpawnOffset: -426,85,0
		ExitCell: 0,1
	Exit@2:
		SpawnOffset: 298,298,0
		ExitCell: 1,1
	Power:
		Amount: 10
	WithBuildingBib:
		Palette: ra_temperat
	SpawnActorsOnSell:
		ActorTypes: wormuzi
	ScalePowerWithHealth:
	BaseBuilding:
	Production@NORMAL:
		Produces: Building, Defence
		RequiresCondition: !classicproductionqueues
	Production@CLASSICPRODUCTIONQUEUES:
		Produces: RABuilding, RADefence
		RequiresCondition: classicproductionqueues
	ProductionBar@BuildingGDI:
		ProductionType: Building
		RequiresCondition: !classicproductionqueues
	ProductionBar@DefenceGDI:
		ProductionType: Defence
		RequiresCondition: !classicproductionqueues
	ProductionBar@RABuildingGDI:
		ProductionType: RABuilding
		RequiresCondition: classicproductionqueues
	ProductionBar@RADefenceGDI:
		ProductionType: RADefence
		RequiresCondition: classicproductionqueues
	ProductionQueue@GDIBuilding:
		Type: Building
		DisplayOrder: 0
		Group: Building
		LowPowerModifier: 200
		ReadyAudio: ConstructionComplete
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	ProductionQueue@GDIDefense:
		Type: Defence
		DisplayOrder: 1
		Group: Defence
		LowPowerModifier: 300
		ReadyAudio: ConstructionComplete
		BlockedAudio: NoBuild
		LimitedAudio: BuildingInProgress
		QueuedAudio: Building
		OnHoldAudio: OnHold
		CancelledAudio: Cancelled
	BaseProvider:
		Cooldown: 75
		Range: 14c0
	#RotationPaletteEffect:
	#	ExcludePalettes: WC1Player
	#LightPaletteRotator:
	#	ExcludePalettes: WC1Player	
	ProvidesPrerequisite@factiongdi:
		Prerequisite: mmworms

