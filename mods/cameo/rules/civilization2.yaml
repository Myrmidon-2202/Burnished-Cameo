World:
	FactionCA@civilization2:
		Name: Civilization 2
		InternalName: civ2
		Game: Special
		Side: Factions
		Description: Civilization 2, real time turn based empire building
		Selectable: True
	####################################################################################################
	#		MPSTARTUNITS
	####################################################################################################
	StartingUnits@mcvonlycivilization2:
		Class: none
		ClassName: MCV Only
		Factions: civ2
		BaseActor: civ2_mcv
	StartingUnits@defaultcivilization2:
		Class: light
		ClassName: Light Support
		Factions: civ2
		BaseActor: civ2_mcv
		SupportActors: wormuzi,wormuzi,wormuzi,wormuzi,wormuzi,wormbazooka,wormbazooka,wormbuggy
	StartingUnits@heavycivilization2:
		Class: heavy
		ClassName: Heavy Support
		Factions: civ2
		BaseActor: civ2_mcv
		SupportActors: wormuzi,wormuzi,wormuzi,wormuzi,wormuzi,wormbazooka,wormbazooka,wormbuggy,wmtnk,wmtnk

^Civ2Building:
	Inherits: ^BaseBuilding
	Tooltip:
		GenericName: Structure
	OwnerLostAction:
		Action: Kill
	Building:
		BuildSounds: wormdrill.wav
	SpawnActorsOnSell:
		ActorTypes: wormuzi
	MustBeDestroyed:
		RequiredForShortGame: true
	ActorLostNotification:
		Notification: BuildingLost
	ShakeOnDeath:
	Demolishable:
		Condition: being-demolished
	Sellable:
		RequiresCondition: !build-incomplete && !being-demolished
		SellSounds: wormdrill.wav
	GrantConditionOnDamageState@2:
		ValidDamageStates: Medium
		Condition: isBurning
	GrantConditionOnDamageState@3:
		ValidDamageStates: Heavy, Critical
		Condition: isBurning2
	WithIdleOverlay@2:
		RequiresCondition: isBurning
		Sequence: burn1
		Palette: player
	WithIdleOverlay@3:
		RequiresCondition: isBurning2
		Sequence: burn2
		Palette: player

^CIV2Infantry:
	RenderSprites:
		PlayerPalette: player
	WithDeathAnimation:
		DeathSequence: die
		CrushedSequence: die-crushed
		UseDeathTypeSuffix: false
	Targetable:
		TargetTypes: Ground, Ant, Cyborg

####################################################################################################
#		MISC
####################################################################################################

^CIV2BuildingFlag:
	WithIdleOverlay:
		Sequence: bigflag
	RenderSprites:

^CIV2UnitFlag:
	WithIdleOverlay:
		Sequence: smallflag
	RenderSprites:

####################################################################################################
#		BUILDING CIV2
####################################################################################################

CIV2_DISTRICT_CAPITAL_BRONZE:
	Inherits: ^Civ2Building
	Inherits@flag: ^CIV2BuildingFlag
	Inherits@shape: ^2x2Shape
	Inherits@CPQ: ^CPQCondition
	Inherits@aicash: ^AIConyardCash
	Inherits@conyard: ^Conyard
	GrantExternalConditionToOwner@BuildingsOwned:
		Condition: BuildingsOwned
	Selectable:
		Bounds: 2048, 2048
	HitShape:
		TargetableOffsets: 630,299,0
	Valued:
		Cost: 2000
	Tooltip:
		Name: Capital District [Bronze]
	ProvidesPrerequisite:
		Prerequisite: civ2_district_capital_bronze
	Building:
		Footprint: xx xx ==
		Dimensions: 2,3
		LocalCenterOffset: 0,-512,0
	Health:
		HP: 110000
	RevealsShroud:
		Range: 4c0
	Transforms:
		IntoActor: civ2_mcv
		Offset: -1,-1
		Facing: 432
		TransformSounds: constru2.aud, hvydoor1.aud
		NoTransformNotification: BuildingCannotPlaceAudio
	RallyPoint:
	Exit@1:
		SpawnOffset: -426,85,0
		ExitCell: 0,1
	Exit@2:
		SpawnOffset: 298,298,0
		ExitCell: 1,1
	Power:
		Amount: 10
	WithBuildingBib:
		Palette: ra_temperat
	SpawnActorsOnSell:
		ActorTypes: wormuzi
	ScalePowerWithHealth:
	BaseBuilding:
	BaseProvider:
		Cooldown: 75
		Range: 14c0
	#RotationPaletteEffect:
	#	ExcludePalettes: WC1Player
	#LightPaletteRotator:
	#	ExcludePalettes: WC1Player	
	ProvidesPrerequisite@factiongdi:
		Prerequisite: mmworms
	WithSpriteBody:
		RequiresCondition: !civ2_era_classic && !civ2_era_medieval

	# Classic Capital Upgrade
	GrantConditionOnPrerequisite@classic:
		Condition: civ2_era_classic
		Prerequisites: civ2_era_classic
	WithSpriteBody@classic:
		Sequence: civ2_district_capital_classic
		RequiresCondition: civ2_era_classic && !civ2_era_medieval
	PowerMultiplier@classic:
		Modifier: 200
		RequiresCondition: civ2_era_classic && !civ2_era_medieval
	DamageMultiplier@classic:
		Modifier: 66
		RequiresCondition: civ2_era_classic && !civ2_era_medieval
		# RequiresCondition: wc2_human_betterfarm && !wc2_human_bestfarm

	# Medieval Capital Upgrade
	GrantConditionOnPrerequisite@medieval:
		Condition: civ2_era_medieval
		Prerequisites: civ2_era_medieval
	WithSpriteBody@medieval:
		Sequence: civ2_district_capital_medieval
		RequiresCondition: civ2_era_medieval
	PowerMultiplier@medieval:
		Modifier: 200
		RequiresCondition: civ2_era_medieval
	DamageMultiplier@medieval:
		Modifier: 66
		RequiresCondition: civ2_era_medieval
		# RequiresCondition: wc2_human_betterfarm && !wc2_human_bestfarm

