####################################################################################################
#		MISC
####################################################################################################

^CIV2BuildingFlag:
	bigflag:
		Filename: civilization2_flags.shp
		Start: 0
		ZOffset: 512
		Offset: 0, -9
	# Small fire for moderate damage.
	burn1:
		Filename: wc2_fire_small.shp
		Start: 0
		Length: 6
		ZOffset: 512
		Offset: 0, -9
		AddExtension: True
	# Large fire for heavy damage.
	burn2:
		Filename: wc2_fire_large.shp
		Start: 0
		Length: 10
		ZOffset: 512
		Offset: 0, -9
		AddExtension: True

^CIV2UnitFlag:
	smallflag:
		Filename: civilization2_flags.shp
		Start: 1
		ZOffset: 512
		Offset: 0, -9

####################################################################################################
#		BUILDING CIV2
####################################################################################################
civ2_district_capital_bronze:
	Inherits: ^CIV2BuildingFlag
	bigflag:
		Offset: -12, -12
	Defaults:
		Filename: civilization2_buildings.shp
		Start: 3
		Scale: 2.0
	idle: 
	damaged-idle: 
	dead: 
	make: 
	bib: 
		Filename: bib2.tem
		UseTilesetExtension: true
		Length: *
		Scale: 1.0
	icon: 
		Filename: civilization_2_icons.png
		Start: 3

