		Description: Stalwart Melee Hero.
		BuildLimit: 1
	Valued:
		Cost: 500
	Mobile:
		Speed: 30
	Health:
		HP: 110000
	ReloadDelayMultiplier@cow:
		Modifier: 60
	Voiced:
		VoiceSet: aliencommandervoice
	Targetable@LEGOHERO:
		TargetTypes: LHEROtarget
	ProximityExternalCondition@PROPAGANDA:
		Range: 6c0
		Condition: propaganda
		RequiresCondition: !disabled
	WithRangeCircle:
		Range: 6c0
		Type: propaganda
		RequiresCondition: !disabled
	WithInfantryBody:
		-IdleSequences: idle1,idle2,idle3,idle4
	WithDeathAnimation:
		UseDeathTypeSuffix: false
	#Buff Spells
	GrantCondition@DEFENSEBUFFSELF:
		Condition: defensebuff
		RequiresCondition: FSD_cond_1
	ProximityExternalCondition@DEFENSEBUFFOTHER:
		Condition: defensebuff
		Range: 6c0
		RequiresCondition: FSD_cond_1 && !disabled
	GrantCondition@SPEEDBUFFSELF:
		Condition: speedbuff
		RequiresCondition: FSD_cond_2
	ProximityExternalCondition@SPEEDBUFFOTHER:
		Condition: speedbuff
		Range: 6c0
		RequiresCondition: FSD_cond_2 && !disabled
	#Spells
	AttackFrontal:
		Armaments: primary, defense, speed, legoesp, crystalcache
	AutoTargetPriority@DEFAULT:
		RequiresCondition: !stance-attackanything && !assault-move && !FSD_cond_2
	AutoTargetPriority@ATTACKANYTHING:
		RequiresCondition: (stance-attackanything || assault-move) && !FSD_cond_2
	AutoTargetPriority@ATTACKANYTHING_HASTE:
		RequiresCondition: (stance-attackanything || assault-move) && FSD_cond_2
		ValidTargets: haste_target
		InvalidTargets: NoAutoTarget
	Armament:
		Name: primary
		Weapon: aliencommandermelee
		FireDelay: 7
		RequiresCondition: (FSD_cond_1 && !wc2_cond_bot_owner) || (FSD_cond_1_AI && wc2_cond_bot_owner) || (FSD_cond_2) 
	Armament@DEFENSE:
		Name: defense
		Weapon: aliencommandermelee
		FireDelay: 7
		TargetStances: Enemy
		GrantCondition: 
			Condition: defensebuff
		RequiresCondition: FSD_cond_2
		PauseOnCondition: mana < 10
	Armament@SPEED:
		Name: speed
		Weapon: aliencommandermelee
		FireDelay: 7
		TargetStances: Enemy
		GrantCondition: 
			Condition: speedbuff
		RequiresCondition: FSD_cond_2
		PauseOnCondition: mana < 10
	Armament@LEGOESP:
		Name: legoesp
		Weapon: legoesp
		AmmoUsage: 55
		FireDelay: 7
		RequiresCondition: FSD_cond_3
		PauseOnCondition: mana < 25
	Armament@CRYSTALCACHE:
		Name: crystalcache
		Weapon: crystalcache
		AmmoUsage: 60
		FireDelay: 7
		RequiresCondition: FSD_cond_4
		PauseOnCondition: mana < 50
	# "Mana" (AmmoPool)
	GrantConditionOnAttack@DEFENSE:
		Condition: cond_defense_drain
		ArmamentNames: deathcoil
		MaximumInstances: 1
		RevokeDelay: 2
	GrantConditionOnAttack@SPEED:
		Condition: cond_speed_drain
		ArmamentNames: speed
		MaximumInstances: 1
		RevokeDelay: 2
	GrantConditionOnAttack@LEGOESP:
		Condition: cond_legoesp_drain
		ArmamentNames: legoesp
		MaximumInstances: 1
		RevokeDelay: 2
	GrantConditionOnAttack@CRYSTALCACHE:
		Condition: cond_crystalcache_drain
		ArmamentNames: crystalcache
		MaximumInstances: 1
		RevokeDelay: 2
	AmmoPool:
		Armaments: primary, defense, speed, legoesp, crystalcache
		Ammo: 255
		PipCount: 10
		AmmoCondition: mana
	ReloadAmmoPool@PassiveRegen:
		Delay: 10
		Count: 1
		ShowSelectionBar: false
	ReloadAmmoPool@DEFENSE:
		Delay: 1
		Count: -100
		RequiresCondition: cond_defense_drain
	ReloadAmmoPool@HASTE:
		Delay: 1
		Count: -50
		RequiresCondition: cond_speed_drain
	ReloadAmmoPool@LEGOESP:
		Delay: 1
		Count: -25
		RequiresCondition: cond_legoesp_drain
	ReloadAmmoPool@CRYSTALCACHE:
		Delay: 1
		Count: -50
		RequiresCondition: cond_crystalcache_drain

	### Visual indicator for mana
	WithAmmoPipsDecoration:
		PipCount: 4
		Position: TopLeft
		FullSequence: pip-green
		AmmoPools:

	### Visual indicator of mode ###
	WithDecoration@Mode_Damage:
		Sequence: damage_spell_icon
		ReferencePoint: Bottom, Right
		RequiresCondition: FSD_cond_1
	WithDecoration@Mode_Speed:
		Sequence: speed_spell_icon
		ReferencePoint: Bottom, Right
		RequiresCondition: FSD_cond_2 
	WithDecoration@Mode_ESP:
		Sequence: esp_spell_icon
		ReferencePoint: Bottom, Right
		RequiresCondition: FSD_cond_3
	WithDecoration@Mode_Crystalcache:
		Sequence: crystal_spell_icon
		ReferencePoint: Bottom, Right
		RequiresCondition: FSD_cond_4
	
	### Starting spell randomizer for AI.
	GrantConditionOnBotOwner@wc2magebotcontrol:
		Condition: wc2_cond_bot_owner
		Bots: easiest, easy, medium, hard, brutal, challenger, unbeatable, cameogod, airforce, defenseai
	GrantRandomCondition@wc2magebotcontrol:
		Conditions: FSD_cond_1_AI, FSD_cond_2_AI, FSD_cond_3_AI, FSD_cond_4_AI
	# FSD_Cond_1 is always granted at start due to the four state deploy.
	GrantCondition@Cond2AI:
		Condition: FSD_cond_2
		RequiresCondition: wc2_cond_bot_owner && FSD_cond_2_AI
	GrantCondition@Cond3AI:
		Condition: FSD_cond_3
		RequiresCondition: wc2_cond_bot_owner && FSD_cond_3_AI
	GrantCondition@Cond4AI:
		Condition: FSD_cond_4
		RequiresCondition: wc2_cond_bot_owner && FSD_cond_4_AI

