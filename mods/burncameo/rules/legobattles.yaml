astro_tower:
	Inherits: ^Defense
	Inherits@lego_tower: ^lego_tower
	# Don't declare AutoTarget stuff before AttackBase stuff or an annoying bug with WithSpriteBody will occur.
	Tooltip:
		Name: Astro Tower
	Buildable:
		Prerequisites: ~astro_conyard
		Queue: Defence, RADefence
		Description: Upgradable defense building. Detector
	Voiced:
		VoiceSet: astrotowervoice
	Armament@PRIMARY:
		Weapon: legoranged
		RequiresCondition: !astrotower2upg && !astrotower3upg
	Armament@AA:
		Weapon: legoranged
		RequiresCondition: !astrotower2upg && !astrotower3upg
	Armament@guardtower:
		Weapon: specialrangedstar
		RequiresCondition: astrotower2upg && !astrotower3upg
	Armament@guardtoweraa:
		Weapon: specialrangedstar
		RequiresCondition: astrotower2upg && !astrotower3upg
	Armament@g3tower:
		Weapon: astroplasmaglob
		RequiresCondition: astrotower2upg && astrotower3upg
	Armament@3toweraa:
		Weapon: astroplasmaglob
		RequiresCondition: astrotower2upg && astrotower3upg
	Turreted:
		TurnSpeed: 1023
		Offset: 128,128,384
	AttackTurreted:
		PauseOnCondition: !build-incomplete
	WithRangeCircle:
		Range: 3072
		# RequiresCondition: astrotower2upg
	Inherits@AUTOTARGET: ^AutoTargetAll
	### Upgrade stuff ###
	WithSpriteBody:
		RequiresCondition: !astrotower2upg && !astrotower3upg
		Sequence: astro_tower
	Production@guardtower:
		Produces: Towerupgrade
		RequiresCondition: !astrotower2upg && !astrotower3upg
	ProductionBar@guardtower:
		ProductionType: Towerupgrade
		RequiresCondition: !astrotower2upg && !astrotower3upg
	ProductionQueue@guardtower:
		Type: Towerupgrade
		DisplayOrder: 0
		Group: Addon
		LowPowerModifier: 200
		QueueLimit: 1
		ItemLimit: 1
		RequiresCondition: !astrotower2upg && !astrotower3upg
	GrantConditionOnProduction@guardtower:
		Condition: astrotower2upg
		Actors: astro_tower2
	WithSpriteBody@guardtower:
		Sequence: astro_tower2
		RequiresCondition: astrotower2upg && !astrotower3upg
	DamageMultiplier@guardtower:
		Modifier: 77
		RequiresCondition: astrotower2upg
	###
	Production@3tower:
		Produces: Towerupgrade2
		RequiresCondition: astrotower2upg && !astrotower3upg
	ProductionBar@3tower:
		ProductionType: Towerupgrade2
	ProductionQueue@3tower:
		Type: Towerupgrade2
		DisplayOrder: 0
		Group: Addon
		LowPowerModifier: 200
		QueueLimit: 1
		ItemLimit: 1
	GrantConditionOnProduction@3tower:
		Condition: astrotower3upg
		Actors: astro_tower3
	WithSpriteBody@3tower:
		Sequence: astro_tower3
		RequiresCondition: astrotower3upg
	DamageMultiplier@3tower:
		Modifier: 87
		RequiresCondition: astrotower3upg
