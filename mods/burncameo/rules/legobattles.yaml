		Cost: 500
	Mobile:
		Speed: 60
	Health:
		HP: 100000
	ReloadDelayMultiplier@cow:
		Modifier: 60
	Voiced:
		VoiceSet: captainbrickbeardvoice
	Targetable@LEGOHERO:
		TargetTypes: LHEROtarget
	ProximityExternalCondition@PROPAGANDA:
		Range: 6c0
		Condition: propaganda
		RequiresCondition: !disabled
	WithRangeCircle:
		Range: 6c0
		Type: propaganda
		RequiresCondition: !disabled
	WithInfantryBody:
		-IdleSequences: idle1,idle2,idle3,idle4
	WithDeathAnimation:
		UseDeathTypeSuffix: false
	#Buff Spells
	GrantCondition@DEFENSEBUFFSELF:
		Condition: defensebuff
		RequiresCondition: FSD_cond_1
	ProximityExternalCondition@DEFENSEBUFFOTHER:
		Condition: defensebuff
		Range: 6c0
		RequiresCondition: FSD_cond_1 && !disabled
	GrantCondition@SPEEDBUFFSELF:
		Condition: speedbuff
		RequiresCondition: FSD_cond_2
	ProximityExternalCondition@SPEEDBUFFOTHER:
		Condition: speedbuff
		Range: 6c0
		RequiresCondition: FSD_cond_2 && !disabled
	#Spells
	AttackFrontal:
		Armaments: primary, speed, speed, monkeyswarm, crabswarm
	AutoTargetPriority@DEFAULT:
		RequiresCondition: !stance-attackanything && !assault-move && !FSD_cond_2
	AutoTargetPriority@ATTACKANYTHING:
		RequiresCondition: (stance-attackanything || assault-move) && !FSD_cond_2
	AutoTargetPriority@ATTACKANYTHING_HASTE:
		RequiresCondition: (stance-attackanything || assault-move) && FSD_cond_2
		ValidTargets: haste_target
		InvalidTargets: NoAutoTarget
	Armament:
		Name: primary
		Weapon: captainmelee
		FireDelay: 7
		RequiresCondition: (FSD_cond_1 && !wc2_cond_bot_owner) || (FSD_cond_1_AI && wc2_cond_bot_owner) || (FSD_cond_2) 
	Armament@speed:
		Name: speed
		Weapon: captainmelee
		FireDelay: 7
		TargetStances: Enemy
		GrantCondition: 
			Condition: defensebuff
		RequiresCondition: FSD_cond_2
		PauseOnCondition: mana < 10
	Armament@SPEED:
		Name: speed
		Weapon: captainmelee
		FireDelay: 7
		TargetStances: Enemy
		GrantCondition: 
			Condition: speedbuff
		RequiresCondition: FSD_cond_2
		PauseOnCondition: mana < 10
	Armament@MONKEYSWARM:
		Name: monkeyswarm
		Weapon: monkeyswarm
		AmmoUsage: 55
		FireDelay: 7
		RequiresCondition: FSD_cond_3
		PauseOnCondition: mana < 25
	Armament@crabswarm:
		Name: crabswarm
		Weapon: crabswarm
		AmmoUsage: 150
		FireDelay: 7
		RequiresCondition: FSD_cond_4
		PauseOnCondition: mana < 50
	# "Mana" (AmmoPool)
	GrantConditionOnAttack@speed:
		Condition: cond_defense_drain
		ArmamentNames: deathcoil
		MaximumInstances: 1
		RevokeDelay: 2
	GrantConditionOnAttack@SPEED:
		Condition: cond_speed_drain
		ArmamentNames: speed
		MaximumInstances: 1
		RevokeDelay: 2
	GrantConditionOnAttack@MONKEYSWARM:
		Condition: cond_monkeyswarm_drain
		ArmamentNames: monkeyswarm
		MaximumInstances: 1
		RevokeDelay: 2
	GrantConditionOnAttack@crabswarm:
		Condition: cond_crabswarm_drain
		ArmamentNames: crabswarm
		MaximumInstances: 1
		RevokeDelay: 2
	AmmoPool:
		Armaments: primary, speed, speed, monkeyswarm, crabswarm
		Ammo: 255
		PipCount: 10
		AmmoCondition: mana
	ReloadAmmoPool@PassiveRegen:
		Delay: 10
		Count: 1
		ShowSelectionBar: false
	ReloadAmmoPool@speed:
		Delay: 1
		Count: -100
		RequiresCondition: cond_defense_drain
	ReloadAmmoPool@HASTE:
		Delay: 1
		Count: -50
		RequiresCondition: cond_speed_drain
	ReloadAmmoPool@MONKEYSWARM:
		Delay: 1
		Count: -25
		RequiresCondition: cond_monkeyswarm_drain
	ReloadAmmoPool@crabswarm:
		Delay: 1
		Count: -50
		RequiresCondition: cond_crabswarm_drain

	### Visual indicator for mana
	WithAmmoPipsDecoration:
		PipCount: 4
		Position: TopLeft
		FullSequence: pip-green
		AmmoPools:

	### Visual indicator of mode ###
	WithDecoration@Mode_Armor:
		Sequence: armor_spell_icon
		ReferencePoint: Bottom, Right
		RequiresCondition: FSD_cond_1
	WithDecoration@Mode_Damage:
		Sequence: speed_spell_icon
		ReferencePoint: Bottom, Right
		RequiresCondition: FSD_cond_2 
	WithDecoration@Mode_Monkeyswarm:
		Sequence: monkey_spell_icon
		ReferencePoint: Bottom, Right
		RequiresCondition: FSD_cond_3
	WithDecoration@Mode_crabswarm:
		Sequence: crab_spell_icon
		ReferencePoint: Bottom, Right
		RequiresCondition: FSD_cond_4

	### Starting spell randomizer for AI.
