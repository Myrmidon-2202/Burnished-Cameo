civ2_mcv:
	Inherits: ^CIV2UnitFlag
	smallflag:
		Offset: -10, -10
	Defaults: 
		Filename: civilization2_units.shp
		Scale: 1.0
	idle:
		Facings: 2
		Combine:
			settler1: 
				Filename: civilization2_units.shp
				Length: 1
				Frames: 0
			settler2: 
				Filename: civilization2_units.shp
				Length: 1
				Frames: 0
				FlipX: true
	icon: 
		Filename: civilization_2_icons.png
		Start: 32

